name: Update Golf Data CSVs

on:
  schedule:
    - cron: '*/30 * * * *'   # Every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-csvs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all CSVs
        run: |
          echo "=== Downloading hole-by-hole-detail.csv ==="
          curl -L -o hole-by-hole-detail.csv \
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vTAvsaoeBBocLCwCz8bqHJnTOgXd55ObC2lCnbu-hikUp_OHGCrOyTNLZlzxQWdhJl5x__28UAUDCdq/pub?gid=632014704&single=true&output=csv" \
            -H "Cache-Control: no-cache, no-store, must-revalidate" \
            -H "Pragma: no-cache"

          echo "=== Downloading tournament-scorecard.csv ==="
          curl -L -o tournament-scorecard.csv \
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vTAvsaoeBBocLCwCz8bqHJnTOgXd55ObC2lCnbu-hikUp_OHGCrOyTNLZlzxQWdhJl5x__28UAUDCdq/pub?gid=1837203257&single=true&output=csv" \
            -H "Cache-Control: no-cache, no-store, must-revalidate" \
            -H "Pragma: no-cache"

          echo "=== Downloading holes.csv ==="
          curl -L -o holes.csv \
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vTAvsaoeBBocLCwCz8bqHJnTOgXd55ObC2lCnbu-hikUp_OHGCrOyTNLZlzxQWdhJl5x__28UAUDCdq/pub?gid=0&single=true&output=csv" \
            -H "Cache-Control: no-cache, no-store, must-revalidate" \
            -H "Pragma: no-cache"

          echo "=== Downloading live-leaderboard.csv ==="
          curl -L -o live-leaderboard.csv \
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vTAvsaoeBBocLCwCz8bqHJnTOgXd55ObC2lCnbu-hikUp_OHGCrOyTNLZlzxQWdhJl5x__28UAUDCdq/pub?gid=686766006&single=true&output=csv" \
            -H "Cache-Control: no-cache, no-store, must-revalidate" \
            -H "Pragma: no-cache"

          echo "=== Downloading cheat-sheet-sportsbooks.csv ==="
          curl -L -o cheat-sheet-sportsbooks.csv \
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vRaE2ATXG7IcOEtFQN0oSydGAe2okpyuZ6dTfV_vfbolt2V7CSZzX4FDFnSemJhxcceG8idxPz8v2y5/pub?gid=1650347945&single=true&output=csv" \
            -H "Cache-Control: no-cache, no-store, must-revalidate" \
            -H "Pragma: no-cache"

      - name: Clean header rows (only needed for some files)
        run: |
          echo "Cleaning hole-by-hole-detail.csv (removing first 2 rows)..."
          tail -n +3 hole-by-hole-detail.csv > temp.csv && mv temp.csv hole-by-hole-detail.csv

          echo "Cleaning tournament-scorecard.csv (removing first 2 rows)..."
          tail -n +3 tournament-scorecard.csv > temp.csv && mv temp.csv tournament-scorecard.csv

          echo ""
          echo "=== Final file sizes ==="
          ls -lh hole-by-hole-detail.csv tournament-scorecard.csv holes.csv live-leaderboard.csv cheat-sheet-sportsbooks.csv

      - name: Commit and push if changed
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"

          git add hole-by-hole-detail.csv tournament-scorecard.csv holes.csv live-leaderboard.csv cheat-sheet-sportsbooks.csv

          if git commit -m "Auto-update golf data CSVs from Google Sheets"; then
            echo "✅ Changes committed — pushing to repo"
            git push
          else
            echo "ℹ️ No changes detected — all CSVs are already up to date"
          fi
